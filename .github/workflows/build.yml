name: Todo en Uno Android 16 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android 36 SDK, unpack 015 first & build APK
        shell: bash
        run: |
          set -e
          python3 - <<'EOF'
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          # 1. Localizar sdkmanager y aceptar licencias + instalar SDK 36 y build-tools
          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          sdkmanager = None
          for candidate in [
              Path(sdk_root) / "cmdline-tools" / "latest" / "bin" / "sdkmanager",
              Path(sdk_root) / "cmdline-tools" / "16.0" / "bin" / "sdkmanager",
          ]:
              if candidate.exists() and os.access(candidate, os.X_OK):
                  sdkmanager = str(candidate)
                  break

          if not sdkmanager:
              sdkmanager = shutil.which("sdkmanager")

          if not sdkmanager:
              for root, _, files in os.walk(sdk_root):
                  if "sdkmanager" in files:
                      p = os.path.join(root, "sdkmanager")
                      if os.access(p, os.X_OK):
                          sdkmanager = p
                          break

          if not sdkmanager:
              raise RuntimeError("No se encontró sdkmanager en el runner")

          print(f"Usando sdkmanager: {sdkmanager}")
          pkgs = ["platform-tools", "platforms;android-36", "build-tools;35.0.0"]

          p_lic = subprocess.Popen(["yes"], stdout=subprocess.PIPE)
          subprocess.run([sdkmanager, f"--sdk_root={sdk_root}", "--licenses"], stdin=p_lic.stdout, check=False)
          p_lic.stdout.close()

          p_inst = subprocess.Popen(["yes"], stdout=subprocess.PIPE)
          res = subprocess.run([sdkmanager, f"--sdk_root={sdk_root}", *pkgs], stdin=p_inst.stdout)
          p_inst.stdout.close()
          if res.returncode != 0:
              raise SystemExit(res.returncode)

          # 2. Extraer PRIMERO el archivo 015 (estructura completa de carpetas) y luego 001..014
          ROOT = Path(".").resolve()
          WORK = ROOT / "_all_in_one_work"
          ZIP_FOLDERS = [ROOT / "zips", ROOT / "paquetes", ROOT]
          SKIP_DIRS = {".git", ".github", ".gradle", "build", "_all_in_one_work", "zips", "paquetes"}

          def zip_order_key(p: Path):
              nums = re.findall(r"\d+", p.stem)
              if nums:
                  n = int(nums[-1])
                  if n == 15:
                      return (0, 0, p.name.lower())
                  return (1, n, p.name.lower())
              return (2, 0, p.name.lower())

          zips = []
          seen = set()
          for folder in ZIP_FOLDERS:
              if folder.exists() and folder.is_dir():
                  for f in folder.iterdir():
                      if f.is_file() and f.suffix.lower() == ".zip":
                          rp = f.resolve()
                          if rp not in seen:
                              seen.add(rp)
                              zips.append(f)
          zips = sorted(zips, key=zip_order_key)

          if WORK.exists():
              shutil.rmtree(WORK, ignore_errors=True)
          WORK.mkdir(parents=True, exist_ok=True)

          for zf_path in zips:
              print(f"Extrayendo ZIP (015 primero): {zf_path.relative_to(ROOT)}")
              with zipfile.ZipFile(zf_path, "r") as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      parts = [part for part in Path(info.filename).parts if part not in ("", ".", "..", "__MACOSX")]
                      if not parts:
                          continue
                      dest = WORK / Path(*parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info, "r") as src, open(dest, "wb") as dst:
                          shutil.copyfileobj(src, dst)

          if zips:
              gradle_roots = []
              for candidate in [WORK] + [p for p in WORK.rglob("*") if p.is_dir()]:
                  if any(part in SKIP_DIRS for part in candidate.relative_to(WORK).parts):
                      continue
                  if (candidate / "settings.gradle").exists() or (candidate / "settings.gradle.kts").exists():
                      gradle_roots.append(candidate)

              source_base = gradle_roots[0] if gradle_roots else WORK
              for item in source_base.rglob("*"):
                  if not item.is_file():
                      continue
                  rel = item.relative_to(source_base)
                  if rel.parts and rel.parts[0] in SKIP_DIRS:
                      continue
                  target = ROOT / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
                  print(f"Colocado/actualizado: {rel}")

          # Copiar carpetas lib/ con librerías nativas (.so) hacia app/src/main/jniLibs/
          jni_dest = ROOT / "app" / "src" / "main" / "jniLibs"
          for lib_dir in list(ROOT.rglob("lib")):
              if not lib_dir.is_dir():
                  continue
              if any(part in SKIP_DIRS or part == "jniLibs" for part in lib_dir.parts):
                  continue
              has_so = any(f.suffix == ".so" for f in lib_dir.rglob("*.so"))
              if has_so:
                  print(f"Copiando librerías nativas desde {lib_dir.relative_to(ROOT)} a app/src/main/jniLibs/")
                  for so_file in lib_dir.rglob("*"):
                      if so_file.is_file():
                          rel_so = so_file.relative_to(lib_dir)
                          out_so = jni_dest / rel_so
                          out_so.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(so_file, out_so)

          has_root_gradle = (
              (ROOT / "settings.gradle").exists()
              or (ROOT / "settings.gradle.kts").exists()
              or (ROOT / "build.gradle").exists()
              or (ROOT / "build.gradle.kts").exists()
          )

          if not has_root_gradle:
              sub_settings = None
              for p in ROOT.rglob("settings.gradle*"):
                  if any(part in SKIP_DIRS for part in p.parts):
                      continue
                  sub_settings = p.parent
                  break

              if sub_settings and sub_settings != ROOT:
                  print(f"Moviendo proyecto Gradle desde subcarpeta: {sub_settings.relative_to(ROOT)}")
                  for item in sub_settings.rglob("*"):
                      if not item.is_file():
                          continue
                      rel = item.relative_to(sub_settings)
                      if rel.parts and rel.parts[0] in SKIP_DIRS:
                          continue
                      target = ROOT / rel
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, target)
              else:
                  print("Generando contenedor base Android 16 (landscape) conservando estructura y carpetas...")
                  (ROOT / "gradle" / "wrapper").mkdir(parents=True, exist_ok=True)
                  (ROOT / "app" / "src" / "main" / "java" / "com" / "stoker" / "zuzu").mkdir(parents=True, exist_ok=True)
                  assets_dir = ROOT / "app" / "src" / "main" / "assets"
                  assets_dir.mkdir(parents=True, exist_ok=True)

                  if WORK.exists():
                      for item in WORK.rglob("*"):
                          if not item.is_file():
                              continue
                          rel = item.relative_to(WORK)
                          dst = assets_dir / rel
                          dst.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(item, dst)

                  (ROOT / "settings.gradle").write_text("rootProject.name = 'StokerZuzy'\ninclude ':app'\n", encoding="utf-8")
                  (ROOT / "gradle.properties").write_text(
                      "org.gradle.jvmargs=-Xmx2048m\n"
                      "android.useAndroidX=true\n"
                      "kotlin.stdlib.default.dependency=false\n",
                      encoding="utf-8",
                  )
                  (ROOT / "gradle" / "wrapper" / "gradle-wrapper.properties").write_text(
                      "distributionBase=GRADLE_USER_HOME\n"
                      "distributionPath=wrapper/dists\n"
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip\n"
                      "zipStoreBase=GRADLE_USER_HOME\n"
                      "zipStorePath=wrapper/dists\n",
                      encoding="utf-8",
                  )
                  (ROOT / "build.gradle").write_text(
                      "buildscript {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "    dependencies {\n"
                      "        classpath 'com.android.tools.build:gradle:8.3.2'\n"
                      "    }\n"
                      "}\n"
                      "allprojects {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "}\n",
                      encoding="utf-8",
                  )
                  (ROOT / "app" / "build.gradle").write_text(
                      "plugins {\n"
                      "    id 'com.android.application'\n"
                      "}\n"
                      "android {\n"
                      "    namespace 'com.stoker.zuzu'\n"
                      "    compileSdk 36\n"
                      "    defaultConfig {\n"
                      "        applicationId 'com.stoker.zuzu'\n"
                      "        minSdk 24\n"
                      "        targetSdk 36\n"
                      "        versionCode 1\n"
                      "        versionName '1.0'\n"
                      "    }\n"
                      "    packaging {\n"
                      "        jniLibs {\n"
                      "            useLegacyPackaging true\n"
                      "        }\n"
                      "    }\n"
                      "    buildTypes {\n"
                      "        release {\n"
                      "            minifyEnabled false\n"
                      "        }\n"
                      "        debug {\n"
                      "            minifyEnabled false\n"
                      "        }\n"
                      "    }\n"
                      "    compileOptions {\n"
                      "        sourceCompatibility JavaVersion.VERSION_17\n"
                      "        targetCompatibility JavaVersion.VERSION_17\n"
                      "    }\n"
                      "}\n"
                      "dependencies {\n"
                      "    implementation 'androidx.appcompat:appcompat:1.7.0'\n"
                      "}\n",
                      encoding="utf-8",
                  )
                  (ROOT / "app" / "src" / "main" / "AndroidManifest.xml").write_text(
                      "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
                      "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n"
                      "    <uses-permission android:name=\"android.permission.CAMERA\" />\n"
                      "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n"
                      "    <uses-permission android:name=\"android.permission.INTERNET\" />\n"
                      "    <application android:label=\"Stoker@Zuzy\" android:usesCleartextTraffic=\"true\">\n"
                      "        <activity android:name=\"com.stoker.zuzu.MainActivity\"\n"
                      "            android:exported=\"true\"\n"
                      "            android:screenOrientation=\"landscape\"\n"
                      "            android:configChanges=\"orientation|screenSize|keyboardHidden\">\n"
                      "            <intent-filter>\n"
                      "                <action android:name=\"android.intent.action.MAIN\" />\n"
                      "                <category android:name=\"android.intent.category.LAUNCHER\" />\n"
                      "            </intent-filter>\n"
                      "        </activity>\n"
                      "    </application>\n"
                      "</manifest>\n",
                      encoding="utf-8",
                  )
                  (ROOT / "app" / "src" / "main" / "java" / "com" / "stoker" / "zuzu" / "MainActivity.java").write_text(
                      "package com.stoker.zuzu;\n"
                      "import android.os.Bundle;\n"
                      "import android.webkit.WebSettings;\n"
                      "import android.webkit.WebView;\n"
                      "import android.webkit.WebViewClient;\n"
                      "import androidx.appcompat.app.AppCompatActivity;\n"
                      "public class MainActivity extends AppCompatActivity {\n"
                      "    @Override\n"
                      "    protected void onCreate(Bundle savedInstanceState) {\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "        WebView webView = new WebView(this);\n"
                      "        WebSettings ws = webView.getSettings();\n"
                      "        ws.setJavaScriptEnabled(true);\n"
                      "        ws.setDomStorageEnabled(true);\n"
                      "        ws.setAllowFileAccess(true);\n"
                      "        webView.setWebViewClient(new WebViewClient());\n"
                      "        webView.loadUrl(\"file:///android_asset/index.html\");\n"
                      "        setContentView(webView);\n"
                      "    }\n"
                      "}\n",
                      encoding="utf-8",
                  )
                  gradlew_sh = ROOT / "gradlew"
                  gradlew_sh.write_text("#!/usr/bin/env sh\nexec gradle \"$@\"\n", encoding="utf-8")
                  gradlew_sh.chmod(0o755)

          # 3. Parchear AndroidManifest.xml (landscape + permisos), Gradle (SDK 36) y conflicto de Kotlin
          for manifest in ROOT.rglob("AndroidManifest.xml"):
              if any(part in SKIP_DIRS for part in manifest.parts):
                  continue
              txt = manifest.read_text(encoding="utf-8", errors="ignore")
              if "android:screenOrientation=" in txt:
                  txt = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="landscape"', txt)
              else:
                  txt = re.sub(r'(<activity\b[^>]*?)(\s*/?>)', r'\1 android:screenOrientation="landscape"\2', txt)

              for perm in ("android.permission.CAMERA", "android.permission.RECORD_AUDIO", "android.permission.INTERNET"):
                  if perm not in txt:
                      tag = f'    <uses-permission android:name="{perm}" />'
                      txt = re.sub(r'(<manifest\b[^>]*>)', r'\1\n' + tag, txt, count=1)

              manifest.write_text(txt, encoding="utf-8")
              print(f"Manifest listo (landscape + SDK 36): {manifest.relative_to(ROOT)}")

          kotlin_fix_block = (
              "\nallprojects {\n"
              "    configurations.all {\n"
              "        resolutionStrategy {\n"
              "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n"
              "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n"
              "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n"
              "        }\n"
              "    }\n"
              "}\n"
          )

          for gfile in ROOT.rglob("build.gradle*"):
              if any(part in SKIP_DIRS for part in gfile.parts):
                  continue
              orig = gfile.read_text(encoding="utf-8", errors="ignore")
              upd = orig
              upd = re.sub(r"\bcompileSdk\s*=?\s*\d+", "compileSdk 36", upd)
              upd = re.sub(r"\bcompileSdkVersion\s*=?\s*\d+", "compileSdkVersion 36", upd)
              upd = re.sub(r"\btargetSdk\s*=?\s*\d+", "targetSdk 36", upd)
              upd = re.sub(r"\btargetSdkVersion\s*=?\s*\d+", "targetSdkVersion 36", upd)
              upd = re.sub(r"com\.android\.application:[\d.]+", "com.android.application:8.3.2", upd)
              if gfile.name == "build.gradle" and "force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" not in upd:
                  upd = upd + kotlin_fix_block
              if upd != orig:
                  gfile.write_text(upd, encoding="utf-8")
                  print(f"Gradle actualizado: {gfile.relative_to(ROOT)}")

          gradle_props = ROOT / "gradle.properties"
          gp_text = gradle_props.read_text(encoding="utf-8", errors="ignore") if gradle_props.exists() else ""
          if "kotlin.stdlib.default.dependency=false" not in gp_text:
              gp_text = (gp_text.rstrip() + "\nkotlin.stdlib.default.dependency=false\n").lstrip()
              gradle_props.write_text(gp_text, encoding="utf-8")

          wrapper = ROOT / "gradle" / "wrapper" / "gradle-wrapper.properties"
          if wrapper.exists():
              w_orig = wrapper.read_text(encoding="utf-8", errors="ignore")
              w_upd = re.sub(r"gradle-[\d.]+-(all|bin)\.zip", "gradle-8.11.1-bin.zip", w_orig)
              if w_upd != w_orig:
                  wrapper.write_text(w_upd, encoding="utf-8")

          shutil.rmtree(WORK, ignore_errors=True)
          EOF

          if [ -f "tools/validate_project.py" ]; then
            python3 tools/validate_project.py
          fi

          set +e
          echo "=== ARCHIVOS EN RAÍZ DEL PROYECTO ==="
          ls -la
          echo "=== ARQUITECTURAS Y LIBRERÍAS .SO ==="
          find app/src/main/jniLibs -maxdepth 3 2>/dev/null || true

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log
            GRADLE_EXIT=${PIPESTATUS[0]}
          else
            gradle assembleDebug --stacktrace 2>&1 | tee gradle_build.log
            GRADLE_EXIT=${PIPESTATUS[0]}
          fi

          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "=== MOTIVO REAL DEL FALLO DE GRADLE ==="
            grep -vE "^[[:space:]]+at " gradle_build.log | grep -vE "^[[:space:]]*$" | tail -n 35
            exit "$GRADLE_EXIT"
          fi

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: juego-android16-landscape
          path: "**/*.apk"
          if-no-files-found: error
