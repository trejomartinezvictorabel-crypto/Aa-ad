name: Todo en Uno Android 16 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '35.0.0'

      - name: Unpack zips, organize folders, patch Android 16 landscape & build APK
        shell: bash
        run: |
          set -e
          python3 - <<'EOF'
          import re
          import shutil
          import zipfile
          from pathlib import Path

          ROOT = Path(".").resolve()
          WORK = ROOT / "_all_in_one_work"
          ZIP_FOLDERS = [ROOT / "zips", ROOT / "paquetes", ROOT]
          SKIP_DIRS = {".git", ".github", ".gradle", "build", "_all_in_one_work", "zips", "paquetes"}

          def sort_key(p: Path):
              nums = re.findall(r"\d+", p.stem)
              return (0, int(nums[0]), p.name.lower()) if nums else (1, 0, p.name.lower())

          zips = []
          seen = set()
          for folder in ZIP_FOLDERS:
              if folder.exists() and folder.is_dir():
                  for f in folder.iterdir():
                      if f.is_file() and f.suffix.lower() == ".zip":
                          rp = f.resolve()
                          if rp not in seen:
                              seen.add(rp)
                              zips.append(f)
          zips = sorted(zips, key=sort_key)

          if WORK.exists():
              shutil.rmtree(WORK, ignore_errors=True)
          WORK.mkdir(parents=True, exist_ok=True)

          for zf_path in zips:
              print(f"Extrayendo ZIP: {zf_path.relative_to(ROOT)}")
              with zipfile.ZipFile(zf_path, "r") as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      parts = [part for part in Path(info.filename).parts if part not in ("", ".", "..", "__MACOSX")]
                      if not parts:
                          continue
                      dest = WORK / Path(*parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info, "r") as src, open(dest, "wb") as dst:
                          shutil.copyfileobj(src, dst)

          if zips:
              source_base = WORK / "app" if ((WORK / "app" / "build.gradle").exists() or (WORK / "app" / "build.gradle.kts").exists()) else WORK
              for item in source_base.rglob("*"):
                  if not item.is_file():
                      continue
                  rel = item.relative_to(source_base)
                  if rel.parts and rel.parts[0] in SKIP_DIRS:
                      continue
                  target = ROOT / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
                  print(f"Colocado/actualizado: {rel}")

          for manifest in ROOT.rglob("AndroidManifest.xml"):
              if any(part in SKIP_DIRS for part in manifest.parts):
                  continue
              txt = manifest.read_text(encoding="utf-8", errors="ignore")
              if "android:screenOrientation=" in txt:
                  txt = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="landscape"', txt)
              else:
                  txt = re.sub(r'(<activity\b[^>]*?)(\s*/?>)', r'\1 android:screenOrientation="landscape"\2', txt)

              for perm in ("android.permission.CAMERA", "android.permission.RECORD_AUDIO", "android.permission.INTERNET"):
                  if perm not in txt:
                      tag = f'    <uses-permission android:name="{perm}" />'
                      txt = re.sub(r'(<manifest\b[^>]*>)', r'\1\n' + tag, txt, count=1)

              manifest.write_text(txt, encoding="utf-8")
              print(f"Manifest listo (landscape + SDK 36): {manifest.relative_to(ROOT)}")

          for gfile in ROOT.rglob("build.gradle*"):
              if any(part in SKIP_DIRS for part in gfile.parts):
                  continue
              orig = gfile.read_text(encoding="utf-8", errors="ignore")
              upd = orig
              upd = re.sub(r"\bcompileSdk\s*=?\s*\d+", "compileSdk 36", upd)
              upd = re.sub(r"\bcompileSdkVersion\s*=?\s*\d+", "compileSdkVersion 36", upd)
              upd = re.sub(r"\btargetSdk\s*=?\s*\d+", "targetSdk 36", upd)
              upd = re.sub(r"\btargetSdkVersion\s*=?\s*\d+", "targetSdkVersion 36", upd)
              upd = re.sub(r"com\.android\.application:[\d.]+", "com.android.application:8.3.2", upd)
              if upd != orig:
                  gfile.write_text(upd, encoding="utf-8")
                  print(f"Gradle actualizado: {gfile.relative_to(ROOT)}")

          wrapper = ROOT / "gradle" / "wrapper" / "gradle-wrapper.properties"
          if wrapper.exists():
              w_orig = wrapper.read_text(encoding="utf-8", errors="ignore")
              w_upd = re.sub(r"gradle-[\d.]+-(all|bin)\.zip", "gradle-8.11.1-bin.zip", w_orig)
              if w_upd != w_orig:
                  wrapper.write_text(w_upd, encoding="utf-8")
                  print("Gradle wrapper en 8.11.1")

          shutil.rmtree(WORK, ignore_errors=True)
          EOF

          if [ -f "tools/validate_project.py" ]; then
            python3 tools/validate_project.py
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: juego-android16-landscape
          path: "**/*.apk"
          if-no-files-found: error
